<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis AI</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --bubble-ai: #21262d;
    --border: #30363d;
    --accent: #58a6ff;
    --text: #e6edf3;
    --muted: #8b949e;
    --user-grad-1: #1f6feb;
    --user-grad-2: #1158c7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .dot { color: var(--accent); font-size: 20px; }
  header h1 { font-size: 15px; margin: 0; font-weight: bold; }
  header .status { margin-left: auto; font-size: 12px; color: var(--muted); }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .bubble {
    max-width: 700px;
    border-radius: 16px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--user-grad-1), var(--user-grad-2));
    border-bottom-right-radius: 4px;
    color: white;
  }
  .bubble.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble .name {
    display: block;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 4px;
    opacity: 0.8;
  }
  #inputBar {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 14px 18px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #msgInput {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #msgInput:focus { border-color: var(--accent); }
  button.iconBtn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    width: 42px;
    height: 42px;
    cursor: pointer;
    font-size: 16px;
  }
  button.iconBtn:hover { border-color: var(--accent); }
  button.iconBtn.active { border-color: #3fb950; color: #3fb950; }
  #sendBtn {
    background: var(--accent);
    border: none;
    color: #0d1117;
    font-weight: bold;
    border-radius: 10px;
    padding: 0 18px;
    height: 42px;
    cursor: pointer;
  }
  #sendBtn:hover { opacity: 0.9; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <span class="dot">◉</span>
  <h1>JARVIS AI</h1>
  <span class="status" id="status">🟢 Ready</span>
</header>

<div id="chat"></div>

<div id="inputBar">
  <button class="iconBtn" id="micBtn" title="Bolke poocho">🎙️</button>
  <input id="msgInput" type="text" placeholder="Kuch bhi poocho..." autocomplete="off" />
  <button class="iconBtn" id="clearBtn" title="Chat clear karo">🗑️</button>
  <button id="sendBtn">Send</button>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const clearBtn = document.getElementById('clearBtn');
const statusEl = document.getElementById('status');

let sessionId = localStorage.getItem('jarvis_session_id');

async function initSession() {
  if (!sessionId) {
    const res = await fetch('/api/session', { method: 'POST' });
    const data = await res.json();
    sessionId = data.session_id;
    localStorage.setItem('jarvis_session_id', sessionId);
  }
}

function addBubble(text, isUser) {
  const b = document.createElement('div');
  b.className = 'bubble ' + (isUser ? 'user' : 'ai');
  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = isUser ? '👤 You' : '🤖 Jarvis';
  const body = document.createElement('span');
  body.className = 'body';
  body.textContent = text;
  b.appendChild(name);
  b.appendChild(body);
  chatEl.appendChild(b);
  chatEl.scrollTop = chatEl.scrollHeight;
  return body;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1.0;
  window.speechSynthesis.speak(utter);
}

async function sendMessage(text) {
  if (!text.trim()) return;
  inputEl.value = '';
  addBubble(text, true);

  const aiBodyEl = addBubble('...', false);
  statusEl.textContent = '🧠 Soch raha hoon...';

  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text, session_id: sessionId })
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let finalText = '';

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    const parts = buffer.split('\n\n');
    buffer = parts.pop();

    for (const part of parts) {
      if (!part.startsWith('data: ')) continue;
      const payload = JSON.parse(part.slice(6));
      if (payload.chunk) {
        finalText += payload.chunk;
        aiBodyEl.textContent = finalText;
        chatEl.scrollTop = chatEl.scrollHeight;
      } else if (payload.error) {
        aiBodyEl.textContent = '⚠️ ' + payload.error;
      } else if (payload.done) {
        statusEl.textContent = '🟢 Ready';
        if (finalText.trim()) speak(finalText);
      }
    }
  }
}

sendBtn.addEventListener('click', () => sendMessage(inputEl.value));
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage(inputEl.value);
});

clearBtn.addEventListener('click', async () => {
  await fetch('/api/clear', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId })
  });
  chatEl.innerHTML = '';
  addBubble('Sab clear kar diya! Nayi shuruaat 🚀', false);
});

// 🎙️ Voice input (Chrome/Edge — Web Speech API)
let recognizing = false;
let recognition = null;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'hi-IN';

  recognition.onstart = () => {
    recognizing = true;
    micBtn.classList.add('active');
    statusEl.textContent = '🎙️ Sun raha hoon...';
  };
  recognition.onend = () => {
    recognizing = false;
    micBtn.classList.remove('active');
    statusEl.textContent = '🟢 Ready';
  };
  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    sendMessage(text);
  };
  micBtn.addEventListener('click', () => {
    if (recognizing) { recognition.stop(); return; }
    recognition.start();
  });
} else {
  micBtn.disabled = true;
  micBtn.title = 'Yeh browser voice input support nahi karta (Chrome try karo)';
}

initSession().then(() => {
  addBubble('Namaste! Main Jarvis hoon 🙏 Aapki kya seva kar sakta hoon?', false);
});
</script>

</body>
</html>
