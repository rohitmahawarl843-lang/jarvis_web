<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis AI</title>
<style>
  :root {
    --bg: #ffffff;
    --sidebar-bg: #f9f9f9;
    --panel: #f5f6f8;
    --bubble-ai: #f5f5f7;
    --border: #e5e5e5;
    --accent: #10a37f;
    --text: #0d0d0d;
    --muted: #6b7280;
    --hover: #ececec;
    --send-bg: #0d0d0d;
  }
  body.dark {
    --bg: #212121;
    --sidebar-bg: #171717;
    --panel: #2a2a2a;
    --bubble-ai: #2f2f2f;
    --border: #3a3a3a;
    --accent: #10a37f;
    --text: #ececec;
    --muted: #9b9b9b;
    --hover: #2f2f2f;
    --send-bg: #ececec;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  body {
    display: flex;
    background: var(--bg);
    color: var(--text);
    transition: background 0.2s, color 0.2s;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 10px;
    transition: transform 0.2s;
  }
  .sideBtn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    background: transparent;
    border: none;
    text-align: left;
    width: 100%;
  }
  .sideBtn:hover { background: var(--hover); }
  #newChatBtn { border: 1px solid var(--border); font-weight: 500; margin-bottom: 6px; }
  #searchInput {
    width: 100%;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    margin: 4px 0 10px 0;
    outline: none;
  }
  #chatList {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 6px;
  }
  .chatItem {
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .chatItem:hover { background: var(--hover); }
  .chatItem.active { background: var(--hover); font-weight: 600; }
  #sidebarBottom {
    border-top: 1px solid var(--border);
    padding-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  /* ---------- Main ---------- */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: relative;
  }
  #topbar {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 14px;
    gap: 10px;
  }
  #menuToggle { display: none; background: none; border: none; font-size: 18px; color: var(--text); cursor: pointer; }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: normal; }

  #hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 20px;
  }
  #hero h1 { font-size: 28px; font-weight: 600; margin: 0; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px 15%;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .bubble {
    max-width: 100%;
    border-radius: 16px;
    padding: 10px 16px;
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
    border-bottom-right-radius: 4px;
    max-width: 70%;
  }
  .bubble.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    border-bottom-left-radius: 4px;
  }
  .bubble .name {
    display: block;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 4px;
    opacity: 0.7;
  }

  #fileChip {
    display: none;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 10px;
    margin: 0 15% 8px 15%;
    font-size: 12px;
    max-width: fit-content;
  }
  #fileChip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; }

  #inputWrap {
    padding: 14px 15% 22px 15%;
  }
  #inputBar {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 8px 8px 8px 16px;
  }
  #msgInput {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    outline: none;
    padding: 8px 0;
  }
  button.roundBtn {
    background: transparent;
    border: none;
    color: var(--text);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  button.roundBtn:hover { background: var(--hover); }
  button.roundBtn.active { color: #ff4d4f; }
  #sendBtn {
    background: var(--send-bg);
    color: var(--bg);
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: 0.4; cursor: default; }
  #hint { text-align: center; font-size: 11px; color: var(--muted); margin-top: 8px; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @media (max-width: 768px) {
    #sidebar {
      position: fixed;
      z-index: 20;
      height: 100vh;
      transform: translateX(-100%);
    }
    #sidebar.open { transform: translateX(0); }
    #menuToggle { display: block; }
    #chat, #fileChip { padding-left: 5%; padding-right: 5%; }
    #inputWrap { padding-left: 5%; padding-right: 5%; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <button class="sideBtn" id="newChatBtn">➕ New chat</button>
  <input id="searchInput" placeholder="🔍 Search chats" />
  <div id="chatList"></div>
  <div id="sidebarBottom">
    <button class="sideBtn" id="themeBtn">🌙 Dark mode</button>
    <button class="sideBtn" id="clearAllBtn">🗑️ Clear all chats</button>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <button id="menuToggle">☰</button>
    <span id="chatTitle">Jarvis AI</span>
    <span id="status">🟢 Ready</span>
  </div>

  <div id="hero">
    <h1>Where should we begin?</h1>
  </div>

  <div id="chat" style="display:none;"></div>

  <div id="fileChip">
    <span>📎</span><span class="fname"></span>
    <button id="removeFileBtn">✕</button>
  </div>

  <div id="inputWrap">
    <div id="inputBar">
      <button class="roundBtn" id="attachBtn" title="File attach karo">📎</button>
      <input type="file" id="fileInput" hidden accept="image/*,video/*,audio/*,.pdf,.txt,.csv,.xlsx,.xls,.docx" />
      <input id="msgInput" type="text" placeholder="Message Jarvis..." autocomplete="off" />
      <button class="roundBtn" id="micBtn" title="Bolke poocho">🎙️</button>
      <button id="sendBtn" title="Send">➤</button>
    </div>
    <div id="hint">Jarvis file (photo/video/PDF/Excel/Word) padh kar uska data analyze kar sakta hai.</div>
  </div>
</div>

<script>
const sidebarEl = document.getElementById('sidebar');
const chatListEl = document.getElementById('chatList');
const searchInput = document.getElementById('searchInput');
const newChatBtn = document.getElementById('newChatBtn');
const themeBtn = document.getElementById('themeBtn');
const clearAllBtn = document.getElementById('clearAllBtn');
const menuToggle = document.getElementById('menuToggle');
const chatTitleEl = document.getElementById('chatTitle');

const heroEl = document.getElementById('hero');
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const statusEl = document.getElementById('status');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const fileChip = document.getElementById('fileChip');
const removeFileBtn = document.getElementById('removeFileBtn');

let chats = JSON.parse(localStorage.getItem('jarvis_chats') || '[]');
let activeChatId = null;
let attachedFile = null;

function saveChats() {
  localStorage.setItem('jarvis_chats', JSON.stringify(chats));
}

// ---------- Theme ----------
function applyTheme(mode) {
  if (mode === 'dark') {
    document.body.classList.add('dark');
    themeBtn.textContent = '☀️ Light mode';
  } else {
    document.body.classList.remove('dark');
    themeBtn.textContent = '🌙 Dark mode';
  }
  localStorage.setItem('jarvis_theme', mode);
}
applyTheme(localStorage.getItem('jarvis_theme') || 'light');
themeBtn.addEventListener('click', () => {
  applyTheme(document.body.classList.contains('dark') ? 'light' : 'dark');
});

// ---------- Sidebar toggle (mobile) ----------
menuToggle.addEventListener('click', () => sidebarEl.classList.toggle('open'));

// ---------- Sidebar rendering ----------
function renderSidebar(filter = '') {
  chatListEl.innerHTML = '';
  const f = filter.trim().toLowerCase();
  chats
    .filter(c => !f || c.title.toLowerCase().includes(f))
    .slice().reverse()
    .forEach(c => {
      const item = document.createElement('div');
      item.className = 'chatItem' + (c.id === activeChatId ? ' active' : '');
      item.textContent = c.title;
      item.addEventListener('click', () => selectChat(c.id));
      chatListEl.appendChild(item);
    });
}
searchInput.addEventListener('input', () => renderSidebar(searchInput.value));

// ---------- Chat bubble rendering ----------
function addBubble(text, isUser) {
  const b = document.createElement('div');
  b.className = 'bubble ' + (isUser ? 'user' : 'ai');
  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = isUser ? '👤 You' : '🤖 Jarvis';
  const body = document.createElement('span');
  body.textContent = text;
  b.appendChild(name);
  b.appendChild(body);
  chatEl.appendChild(b);
  chatEl.scrollTop = chatEl.scrollHeight;
  return body;
}

function renderMessages(chat) {
  chatEl.innerHTML = '';
  chat.messages.forEach(m => addBubble(m.text, m.role === 'user'));
}

function showHero() {
  heroEl.style.display = 'flex';
  chatEl.style.display = 'none';
  chatTitleEl.textContent = 'Jarvis AI';
}
function showChat() {
  heroEl.style.display = 'none';
  chatEl.style.display = 'flex';
}

// ---------- New chat / select chat ----------
newChatBtn.addEventListener('click', () => {
  activeChatId = null;
  showHero();
  renderSidebar(searchInput.value);
  sidebarEl.classList.remove('open');
});

function selectChat(id) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  activeChatId = id;
  chatTitleEl.textContent = chat.title;
  showChat();
  renderMessages(chat);
  renderSidebar(searchInput.value);
  sidebarEl.classList.remove('open');
}

clearAllBtn.addEventListener('click', () => {
  if (!confirm('Sab chats delete karni hain?')) return;
  chats = [];
  activeChatId = null;
  saveChats();
  showHero();
  renderSidebar();
});

async function ensureActiveChat(firstMessageText) {
  if (activeChatId) return chats.find(c => c.id === activeChatId);
  const res = await fetch('/api/session', { method: 'POST' });
  const data = await res.json();
  const title = (firstMessageText || 'File chat').slice(0, 30) || 'New chat';
  const chat = { id: data.session_id, title, messages: [] };
  chats.push(chat);
  activeChatId = chat.id;
  saveChats();
  renderSidebar(searchInput.value);
  return chat;
}

// ---------- File attach ----------
attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  attachedFile = e.target.files[0] || null;
  updateFileChip();
});
removeFileBtn.addEventListener('click', () => {
  attachedFile = null;
  updateFileChip();
});
function updateFileChip() {
  if (attachedFile) {
    fileChip.style.display = 'flex';
    fileChip.querySelector('.fname').textContent = attachedFile.name;
  } else {
    fileChip.style.display = 'none';
    fileInput.value = '';
  }
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1.0;
  window.speechSynthesis.speak(utter);
}

// ---------- Send message ----------
async function sendMessage(text) {
  if (!text.trim() && !attachedFile) return;

  const fileToSend = attachedFile;
  const displayText = text.trim() || ('📎 ' + (fileToSend ? fileToSend.name : ''));
  inputEl.value = '';
  attachedFile = null;
  updateFileChip();

  const chat = await ensureActiveChat(displayText);
  showChat();

  chat.messages.push({ role: 'user', text: displayText });
  addBubble(displayText, true);
  saveChats();
  renderSidebar(searchInput.value);

  const aiBodyEl = addBubble('...', false);
  statusEl.textContent = '🧠 Soch raha hoon...';
  sendBtn.disabled = true;

  const formData = new FormData();
  formData.append('message', text);
  formData.append('session_id', chat.id);
  if (fileToSend) formData.append('file', fileToSend);

  try {
    const res = await fetch('/api/chat', { method: 'POST', body: formData });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let finalText = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        const payload = JSON.parse(part.slice(6));
        if (payload.chunk) {
          finalText += payload.chunk;
          aiBodyEl.textContent = finalText;
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (payload.error) {
          aiBodyEl.textContent = '⚠️ ' + payload.error;
        } else if (payload.done) {
          statusEl.textContent = '🟢 Ready';
          if (finalText.trim()) speak(finalText);
        }
      }
    }
    chat.messages.push({ role: 'ai', text: finalText || aiBodyEl.textContent });
    saveChats();
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', () => sendMessage(inputEl.value));
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage(inputEl.value);
});

// 🎙️ Voice input (Chrome/Edge — Web Speech API)
let recognizing = false;
let recognition = null;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'hi-IN';

  recognition.onstart = () => {
    recognizing = true;
    micBtn.classList.add('active');
    statusEl.textContent = '🎙️ Sun raha hoon...';
  };
  recognition.onend = () => {
    recognizing = false;
    micBtn.classList.remove('active');
    statusEl.textContent = '🟢 Ready';
  };
  recognition.onresult = (event) => sendMessage(event.results[0][0].transcript);
  micBtn.addEventListener('click', () => {
    if (recognizing) { recognition.stop(); return; }
    recognition.start();
  });
} else {
  micBtn.disabled = true;
  micBtn.title = 'Yeh browser voice input support nahi karta (Chrome try karo)';
}

// ---------- Init ----------
renderSidebar();
showHero();
</script>

</body>
</html>
